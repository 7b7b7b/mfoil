function render(){const q=$('search').value.toLowerCase().trim(),filter=$('filter').value,year=$('year').value;const shown=papers.filter(p=>(!q||[p.title,p.journal,p.doi,p.id].join(' ').toLowerCase().includes(q))&&(!year||p.year===year)&&(filter==='all'||filter==='pending'&&p.missing&&!p.local&&!done.has(p.id)||filter==='local'&&p.local||filter==='remaining'&&!done.has(p.id)));const pending=papers.filter(p=>p.missing&&!p.local&&!done.has(p.id)).length;$('stats').textContent='全部 '+papers.length+' 篇 · 当前 '+shown.length+' 篇 · 缺图且待下载 '+pending+' 篇 · 手动勾选 '+done.size+' 篇';$('list').innerHTML=shown.map(p=>'<article class="'+(done.has(p.id)?'done':'')+'"><div><div class="year">'+esc(p.year)+'</div><div class="number">#'+esc(p.number)+'</div></div><div><h2>'+esc(p.title)+'</h2><div class="meta">'+esc(p.journal)+(p.doi?'<br>DOI: '+esc(p.doi):'')+'</div><div class="tag">'+(p.local?'已有本地 PDF':p.missing?'缺图，优先下载':'已有配图，可选下载')+'</div>'+(p.pdf?'<div class="smallnote">'+esc(p.evidence)+'</div>':'')+'</div><div class="actions">'+(p.local?'<a class="action local" target="_blank" rel="noopener" href="'+esc(p.local)+'">打开本地 PDF</a>':'')+(p.pdf?'<a class="action primary" target="_blank" rel="noopener" href="'+esc(p.pdf)+'">打开 PDF ↗</a>':'')+(p.original?'<a class="action" target="_blank" rel="noopener" href="'+esc(p.original)+'">原文入口 ↗</a>':'<span>链接待补</span>')+'<label><input type="checkbox" data-id="'+esc(p.id)+'" '+(done.has(p.id)?'checked':'')+'>我已下载</label></div></article>').join('')||'<p class="empty">没有符合条件的论文。</p>'}
$('list').addEventListener('change',e=>{const id=e.target.dataset.id;if(!id)return;e.target.checked?done.add(id):done.delete(id);try{localStorage.setItem(KEY,JSON.stringify([...done]))}catch{}render()});['search','filter','year'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));render();
